[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hivemind-ai"
version = "0.1.0"
description = "Agents-as-code framework for provisioning, connecting and governing a fleet of Microsoft Foundry agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Deploy to / invoke agents in Microsoft Foundry.
azure = [
  "azure-ai-projects>=2.8.0",
  "azure-identity>=1.17",
  "openai>=1.60",
]
# Run the HiveMind Hub (shared memory + delegation MCP server).
hub = [
  "mcp>=2.2",
  "uvicorn>=0.30",
  "PyJWT[crypto]>=2.8",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
hivemind = "hivemind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
