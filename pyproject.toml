[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hivemind-ai"
version = "0.3.0"
description = "Operating model for an AI-native workforce on Microsoft Foundry: agents as code, graduated autonomy, eval gates and processes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Deploy to / invoke agents in Microsoft Foundry.
azure = [
  "azure-ai-projects>=2.8.0",
  "azure-identity>=1.17",
  "openai>=1.60",
]
# Run processes (Agent Framework declarative workflows) locally with `hivemind process run`.
processes = [
  "agent-framework-declarative>=1.2,<2",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "jsonschema>=4.20",
]

[project.scripts]
hivemind = "hivemind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
