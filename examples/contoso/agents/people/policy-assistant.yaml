apiVersion: hivemind/v1
kind: Agent
name: policy-assistant
display_name: Policy Assistant
description: Answers employees' questions about Contoso policies in Teams, citing the policy library.
role: worker
team: people
owner: people.ops@contoso.com
reports_to: chief-of-staff
goals: [employee-experience]
instructions:
