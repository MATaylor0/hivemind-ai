# HiveMind organisation definition: the single source of truth for the agent fleet.
apiVersion: hivemind/v1

org:
  name: Contoso
  description: Contoso's digital workforce, run on Microsoft Foundry.

# Inherited by every agent. The "constitution" and shared knowledge live here.
defaults:
  model: gpt-5-mini
  instructions:
    - file: instructions/org/constitution.md
  knowledge:
    - org-policies          # Azure AI Search index of the policy library (works for unattended agents too)

teams:
  executive:
    description: Leadership support and cross-team coordination.
  finance:
    description: Accounts payable, planning and month-end close.
    instructions:
      - file: instructions/teams/finance.md
    knowledge:
      - finance-handbook
  risk:
    description: Independent review of agent outputs and actions.
  people:
    description: HR policy and employee questions.

# What the organisation is trying to achieve. Agents and tasks link to goals so work carries its "why".
goals:
  fy27-margin:
    title: Lift FY27 operating margin to 18%
    owner: cfo@contoso.com
  working-capital:
    title: Pay suppliers accurately and on time, without paying early
    parent: fy27-margin
  fast-close:
    title: Close the books within 3 business days
    parent: fy27-margin
  employee-experience:
    title: Employees get clear policy answers in under a minute

# The HiveMind SharePoint site: business-owned rules (Word documents), agent outputs and the task queue.
# Create it with `hivemind sharepoint provision -e <env>`.
sharepoint:
  site: contoso.sharepoint.com/sites/HiveMind
  output_format: docx

# Shared organisational memory (enforced by the hub). `org` and `team:<team>` scopes are implicit.
memory:
  store: hivemind-memory
  backend: foundry
  embedding_model: text-embedding-3-small
  scopes:
    month-end-close:
      description: Status, blockers and decisions for the current month-end close.
      read: ["team:finance", "tier:executive", "team:risk"]
      write: ["team:finance"]

hub:
  enabled: true
  # Foundry connection using the agents' Microsoft Entra identity (agentic identity) to call the hub.
  connection: hivemind-hub
  auth: entra
  audience: ${env:HIVEMIND_HUB_AUDIENCE:-api://hivemind-hub}
  tenant_id: ${env:AZURE_TENANT_ID:-}
  max_delegation_depth: 4
  tasks:
    backend: sharepoint             # the "Agent Tasks" list on the HiveMind site
    workers: 4
    wait_seconds: 45
    max_tasks_per_request: 30

models:
  allowed: [gpt-5, gpt-5-mini, gpt-4.1]
  pricing:                          # USD per 1M tokens, used by observability/agent-cost.kql
    gpt-5:      {input_per_1m: 1.25, output_per_1m: 10.0}
    gpt-5-mini: {input_per_1m: 0.25, output_per_1m: 2.0}
    gpt-4.1:    {input_per_1m: 2.0,  output_per_1m: 8.0}

policies:
  require_owner: true
  require_budget: true
  require_reviewer_for_write_tools: true
  max_hierarchy_depth: 5

environments:
  local:
    provider: local
    sharepoint_local_dir: sharepoint   # a folder standing in for the SharePoint site
    variables:
      FABRIC_MCP_URL: https://localhost/fabric-mcp
      ERP_MCP_URL: https://localhost/erp-mcp
      SP_POLICIES_CONNECTION: sp-policies
      POLICY_SEARCH_CONNECTION: policy-search
      FINANCE_SEARCH_CONNECTION: finance-search
      FABRIC_DATA_AGENT_CONNECTION: fabric-sales
      WORK_IQ_CONNECTION: work-iq
      WORK_IQ_MAIL_URL: https://localhost/work-iq-mail
  dev:
    provider: foundry
    endpoint: ${env:FOUNDRY_ENDPOINT_DEV}
    name_prefix: dev-
    hub_url: ${env:HIVEMIND_HUB_URL_DEV:-https://hivemind-hub-dev.example.azurecontainerapps.io/mcp}
    model_overrides:
      gpt-5: gpt-5-mini             # keep dev cheap
    variables:
      FABRIC_MCP_URL: https://api.fabric.microsoft.com/v1/mcp/workspaces/dev-finance
      ERP_MCP_URL: https://erp-mcp-dev.contoso.com/mcp
      SP_POLICIES_CONNECTION: sp-policies-dev
      POLICY_SEARCH_CONNECTION: policy-search-dev
      FINANCE_SEARCH_CONNECTION: finance-search-dev
      FABRIC_DATA_AGENT_CONNECTION: fabric-sales-dev
      WORK_IQ_CONNECTION: work-iq
      WORK_IQ_MAIL_URL: ${env:WORK_IQ_MAIL_URL:-https://agent365.svc.cloud.microsoft/mcp/mail}
  prod:
    provider: foundry
    protected: true                 # changes only via pull request + the approval-gated deploy workflow
    endpoint: ${env:FOUNDRY_ENDPOINT_PROD}
    hub_url: ${env:HIVEMIND_HUB_URL_PROD:-https://hivemind-hub.example.azurecontainerapps.io/mcp}
    variables:
      FABRIC_MCP_URL: https://api.fabric.microsoft.com/v1/mcp/workspaces/finance
      ERP_MCP_URL: https://erp-mcp.contoso.com/mcp
      SP_POLICIES_CONNECTION: sp-policies
      POLICY_SEARCH_CONNECTION: policy-search
      FINANCE_SEARCH_CONNECTION: finance-search
      FABRIC_DATA_AGENT_CONNECTION: fabric-sales
      WORK_IQ_CONNECTION: work-iq
      WORK_IQ_MAIL_URL: ${env:WORK_IQ_MAIL_URL:-https://agent365.svc.cloud.microsoft/mcp/mail}
