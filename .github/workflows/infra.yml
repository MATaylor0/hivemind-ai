# Platform infrastructure for one environment: Foundry account and project, monitoring, registry, deploy identity.
# Everything that runs on Foundry is deployed by the "Deploy agents" workflow (azd), not here.
# PRs touching infra/ get a Bicep build and lint; deployments are manual (what-if, then deploy).
# Prerequisite: infra/scripts/bootstrap.sh (see infra/README.md).
name: Infrastructure

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: what-if previews; deploy applies
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  id-token: write
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: |
          for p in infra/*.bicepparam; do az bicep build-params --file "$p" --stdout > /dev/null; done
      - run: az bicep lint --file infra/main.bicep

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: bicep
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: infra-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RG: ${{ vars.HIVEMIND_RESOURCE_GROUP }}
      PARAMS: infra/main.${{ inputs.environment }}.bicepparam
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        if: inputs.action == 'what-if'
        run: az deployment group what-if -g "$RG" -f infra/main.bicep -p "$PARAMS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy
        if: inputs.action == 'deploy'
        run: |
          az deployment group create -g "$RG" -n "hivemind-${{ github.run_number }}" -f infra/main.bicep -p "$PARAMS" \
            --query properties.outputs -o json > outputs.json
          {
            echo "### Set these variables on the '${{ inputs.environment }}' GitHub environment"
            echo '```'
            jq -r '.githubVariables.value | to_entries[] | "\(.key)=\(.value)"' outputs.json
            echo '```'
            echo "Grant SharePoint access: infra/scripts/entra-setup.sh sharepoint ${{ inputs.environment }} <site> $(jq -r .deployClientId.value outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
