# Deploys the agent workforce: dev first; production only if every agent passed its eval gate in dev, and then
# behind the 'prod' GitHub environment's required reviewers.
#
#   hivemind apply  -> generates azure.yaml (agents, routines, evals, process hosts) and runs `azd deploy --all`
#   hivemind gate   -> `azd ai eval run start --fail-on pass-rate=<n>` per agent (threshold from its autonomy level)
name: Deploy agents

on:
  push:
    branches: [main]
    paths: ["examples/**", "orgs/**", ".github/workflows/deploy*.yml"]
  workflow_dispatch:
    inputs:
      promote:
        description: Promote to prod after dev passes its gates
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev

  prod:
    needs: dev
    if: github.event_name == 'push' || inputs.promote
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
