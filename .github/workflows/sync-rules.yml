# Business users change agent rules by editing Word documents on the HiveMind SharePoint site. This job picks up
# approved changes: it plans every hour and applies only when something changed. Agents whose rules did not change
# are untouched (content hash). For faster pickup, trigger this workflow from a Power Automate flow on the
# "Agent Rules" library (When a file is created or modified -> GitHub: create a workflow dispatch event).
name: Sync SharePoint rules

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: prod
    env:
      HIVEMIND_ORG: ${{ vars.HIVEMIND_ORG || 'examples/contoso' }}
      FOUNDRY_ENDPOINT_PROD: ${{ vars.FOUNDRY_ENDPOINT_PROD }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[azure]"
      - uses: Azure/setup-azd@v2
      - name: Sign in (OIDC)
        run: |
          azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}"
          azd extension install azure.ai.agents azure.ai.projects azure.ai.routines azure.ai.evaluations
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan
        id: plan
        run: |
          set +e
          hivemind plan -e prod --detailed-exitcode | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          [ "$code" = 1 ] && exit 1
          echo "changed=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Apply
        if: steps.plan.outputs.changed == 'true'
        run: hivemind apply -e prod --yes
      - name: Eval gate
        if: steps.plan.outputs.changed == 'true'
        run: hivemind gate -e prod | tee -a "$GITHUB_STEP_SUMMARY"
